version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: forum_db
    environment:
      POSTGRES_USER: forum_user
      POSTGRES_PASSWORD: forum_password_123 # Güvenli bir şifre
      POSTGRES_DB: forum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: